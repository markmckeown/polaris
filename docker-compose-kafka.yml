services:
  # Single-node Kafka broker using KRaft mode (no Zookeeper required)
  kafka:
    image: apache/kafka:latest
    container_name: polaris-test-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFERED_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFLINE_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # Polaris server built from the local project
  polaris:
    image: apache/polaris:1.6.0-SNAPSHOT
    container_name: polaris-test-server
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      quarkus.log.file.enabled: "false"
      quarkus.otel.sdk.disabled: "true"
      
      # Kafka event listener settings
      polaris.event-listener.type: "kafka"
      polaris.event-listener.kafka.bootstrap-servers: "kafka:29092"
      polaris.event-listener.kafka.topic: "polaris-catalog-events"
      polaris.event-listener.kafka.synchronous-mode: "false"
      
      # Core features
      'polaris.features."DROP_WITH_PURGE_ENABLED"': "true"
      'polaris.features."ALLOW_INSECURE_STORAGE_TYPES"': "true"
      'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"': '["FILE","S3","GCS","AZURE"]'
      'polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"': "true"
      'polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"': "true"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web interface to inspect Kafka topics and consumed messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: polaris-test-kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
